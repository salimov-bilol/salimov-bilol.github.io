<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Task 2 Structure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-intro: #3b82f6; /* Blue */
            --color-body1: #8b5cf6; /* Violet */
            --color-body2: #f97316; /* Orange */
            --color-conclusion: #10b981; /* Emerald */
            --bg-light: #f8fafc; /* Slate 50 */
            --bg-dark: #1e293b; /* Slate 800 */
            --text-dark: #0f172a; /* Slate 900 */
            --text-light: #f1f5f9; /* Slate 100 */
            --text-muted: #94a3b8; /* Slate 400 */
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            font-weight: 700;
        }

        .step-nav {
            transition: all 0.25s ease-in-out;
            border-left: 4px solid transparent;
        }

        .step-nav:hover {
            background-color: #334155;
            transform: translateX(5px);
        }

        .step-nav[data-step="1"].active {
            background-color: var(--color-intro);
            color: white;
            border-left-color: #dbeafe;
        }
        .step-nav[data-step="2"].active {
            background-color: var(--color-body1);
            color: white;
            border-left-color: #ddd6fe;
        }
        .step-nav[data-step="3"].active {
            background-color: var(--color-body2);
            color: white;
            border-left-color: #fed7aa;
        }
        .step-nav[data-step="4"].active {
            background-color: var(--color-conclusion);
            color: white;
            border-left-color: #a7f3d0;
        }

        .content-panel {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            will-change: opacity, transform;
        }

        .content-panel.hidden {
            opacity: 0;
            transform: translateY(15px);
            position: absolute;
            pointer-events: none;
            visibility: hidden;
        }
    </style>
</head>
<body class="antialiased">

<div class="flex flex-col md:flex-row min-h-screen bg-white">
    <!-- Left Navigation Panel -->
    <aside class="w-full md:w-1/3 lg:w-1/4 p-6 md:p-8 shadow-2xl" style="background-color: var(--bg-dark); color: var(--text-light);">
        <h1 class="text-3xl font-bold mb-2">Task 2 Essay Flow</h1>
        <p class="mb-8" style="color: var(--text-muted);">Select a paragraph to build.</p>
        <nav id="steps-navigation" class="space-y-3">
        </nav>
    </aside>

    <!-- Right Content Panel -->
    <main class="w-full md:w-2/3 lg:w-3/4 p-6 sm:p-8 md:p-12 relative" style="background-color: var(--bg-light);">

        <div id="content-panels-container"></div>

        <div id="summary-section" class="mt-12 pt-8 border-t-2 border-slate-200">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div id="strategy-card"></div>
                <div id="avoid-card"></div>
            </div>
        </div>
    </main>
</div>

<script id="essay-data" type="application/json">
    {
        "intro": {
            "title": "Paragraph 1: Introduction",
            "subtitle": "The roadmap for your essay (2 Sentences)",
            "details": "This paragraph sets the stage. It tells the examiner exactly what to expect, showing you have understood the question and have a clear plan.",
            "goal": "To introduce the topic and clearly state your thesis or main points.",
            "actions": [
                "<strong>Sentence 1:</strong> Paraphrase the question topic in your own words.",
                "<strong>Sentence 2 (Thesis):</strong> Directly answer the question. State your opinion, or outline the points you will discuss."
            ],
            "tip": {
                "title": "The Thesis is Key",
                "text": "Your thesis statement is the most important sentence in the entire essay. It must be clear, direct, and confident."
            }
        },
        "body1": {
            "title": "Paragraph 2: Body Paragraph 1",
            "subtitle": "Developing Your First Main Point",
            "details": "This is where you begin to build your argument. Focus on a single, clear idea and support it thoroughly. The goal is depth, not just listing ideas.",
            "goal": "To present and develop your first main argument or discussion point.",
            "actions": [
                "<strong>Topic Sentence:</strong> Start with a sentence that clearly states the main idea of this paragraph.",
                "<strong>Explanation:</strong> Explain what you mean by the topic sentence in more detail.",
                "<strong>Example:</strong> Provide a specific example (from personal experience, general knowledge, etc.) to support your point."
            ],
            "adaptation": {
                "title": "Adapting for Question Types",
                "types": [
                    {
                        "name": "Opinion Essays",
                        "description": "Dedicate each body paragraph to a different reason supporting your opinion."
                    },
                    {
                        "name": "Discussion Essays",
                        "description": "Use Body Paragraph 1 for the first viewpoint, and Body Paragraph 2 for the second viewpoint."
                    },
                    {
                        "name": "Problem/Solution Essays",
                        "description": "Use Body Paragraph 1 for the causes/problems, and Body Paragraph 2 for the solutions."
                    }
                ]
            }
        },
        "body2": {
            "title": "Paragraph 3: Body Paragraph 2",
            "subtitle": "Developing Your Second Main Point",
            "details": "This paragraph follows the exact same structure as the first body paragraph, but focuses on a new, distinct idea. This demonstrates good essay structure and organization.",
            "goal": "To present and develop your second main argument or discussion point.",
            "actions": [
                "<strong>Topic Sentence:</strong> Start with a sentence for your second main point.",
                "<strong>Explanation:</strong> Elaborate on this second point.",
                "<strong>Example:</strong> Provide a relevant, specific example to prove your point."
            ],
            "tip": {
                "title": "Crucial Rule: One Idea Per Paragraph",
                "text": "Never mix two different main ideas in the same paragraph. This is essential for a high score in Coherence and Cohesion."
            }
        },
        "conclusion": {
            "title": "Paragraph 4: Conclusion",
            "subtitle": "The Final Summary (1-2 Sentences)",
            "details": "The conclusion is a brief wrap-up of your essay. Its job is to remind the examiner of your main points and provide a sense of finality.",
            "goal": "To summarize your main points and restate your thesis in a new way.",
            "actions": [
                "<strong>Sentence 1:</strong> Restate your thesis from the introduction using different words.",
                "<strong>Sentence 2 (Optional):</strong> Briefly summarize the two main ideas from your body paragraphs."
            ],
            "tip": {
                "title": "Golden Rule: No New Information",
                "text": "Never introduce new arguments or ideas in your conclusion. Simply summarize what you have already written."
            }
        },
        "strategy": {
            "title": "Why This Structure Works",
            "points": [
                "It creates a logically structured argument.",
                "It fully develops ideas with support.",
                "It's flexible for any Task 2 question type.",
                "It shows the examiner you can build a coherent essay."
            ]
        },
        "avoid": {
            "title": "What to Avoid",
            "points": [
                "Don't give a vague or unclear thesis statement.",
                "Never forget to include specific examples.",
                "Don't write a one-sentence paragraph.",
                "Don't introduce new ideas in the conclusion."
            ]
        }
    }
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const data = JSON.parse(document.getElementById('essay-data').textContent);
        const navContainer = document.getElementById('steps-navigation');
        const contentContainer = document.getElementById('content-panels-container');
        const strategyCard = document.getElementById('strategy-card');
        const avoidCard = document.getElementById('avoid-card');

        const steps = [
            { key: 'intro', color: 'var(--color-intro)', icon: '🎯' },
            { key: 'body1', color: 'var(--color-body1)', icon: '🧠' },
            { key: 'body2', color: 'var(--color-body2)', icon: '🧠' },
            { key: 'conclusion', color: 'var(--color-conclusion)', icon: '🏁' }
        ];

        steps.forEach((step, index) => {
            const stepKey = step.key;
            const stepData = data[stepKey];
            const stepNum = index + 1;

            const navLink = document.createElement('a');
            navLink.href = '#';
            navLink.className = 'step-nav block p-4 rounded-lg';
            navLink.style.backgroundColor = '#475569';
            navLink.dataset.step = stepNum;
            navLink.innerHTML = `<h3 class="font-bold">${stepData.title}</h3><p class="text-sm opacity-80">${stepData.subtitle}</p>`;
            navContainer.appendChild(navLink);

            const contentPanel = document.createElement('div');
            contentPanel.id = `step-${stepNum}-content`;
            contentPanel.className = 'content-panel hidden';

            let actionsHtml = stepData.actions.map(action => `<li>${action}</li>`).join('');

            let tipHtml = '';
            if (stepData.tip) {
                tipHtml = `
                    <div class="mt-6 border-t pt-6">
                        <h4 class="text-xl font-bold mb-2" style="color: ${step.color};">${stepData.tip.title}</h4>
                        <p class="bg-sky-50 p-4 rounded-md border-l-4" style="border-color: ${step.color}; color: var(--text-dark);">${stepData.tip.text}</p>
                    </div>`;
            }

            let adaptationHtml = '';
            if (stepData.adaptation) {
                let typesHtml = stepData.adaptation.types.map(type => `
                    <div>
                        <h5 class="font-semibold text-slate-800">${type.name}</h5>
                        <p class="text-slate-600 mt-1 ml-4 border-l-2 pl-4 border-slate-200">${type.description}</p>
                    </div>
                `).join('');
                adaptationHtml = `
                    <div class="mt-6 border-t pt-6">
                        <h4 class="text-xl font-bold mb-4 text-cyan-600">${stepData.adaptation.title}</h4>
                        <div class="space-y-4">
                            ${typesHtml}
                        </div>
                    </div>`;
            }

            contentPanel.innerHTML = `
                <h2 class="text-3xl font-bold mb-4" style="color: ${step.color};">${stepData.title}</h2>
                <p class="text-lg text-slate-600 mb-6">${stepData.details}</p>
                <div class="bg-white p-6 rounded-lg shadow-md" style="border-left: 4px solid ${step.color};">
                    <h4 class="text-xl font-bold mb-4">Your Blueprint:</h4>
                    <ul class="space-y-4">
                        <li class="flex items-start">
                            <span class="text-2xl mr-4" style="color: ${step.color};">${step.icon}</span>
                            <div><strong class="text-slate-800">Goal:</strong> ${stepData.goal}</div>
                        </li>
                        <li class="flex items-start">
                            <span class="text-2xl mr-4" style="color: ${step.color};">✍️</span>
                            <div>
                                <strong class="text-slate-800">Action Checklist:</strong>
                                <ul class="list-disc list-inside mt-1 text-slate-600 space-y-1">
                                    ${actionsHtml}
                                </ul>
                            </div>
                        </li>
                    </ul>
                    ${adaptationHtml}
                    ${tipHtml}
                </div>
            `;
            contentContainer.appendChild(contentPanel);
        });

        strategyCard.innerHTML = `
            <h3 class="text-2xl font-bold mb-4 text-green-600">Why This Structure Works</h3>
            <ul class="space-y-2 text-slate-600">
                ${data.strategy.points.map(p => `<li class="flex items-center"><span class="mr-3 text-green-500 text-xl">✔</span>${p}</li>`).join('')}
            </ul>`;

        avoidCard.innerHTML = `
            <h3 class="text-2xl font-bold mb-4 text-red-600">What to Avoid</h3>
            <ul class="space-y-2 text-slate-600">
                ${data.avoid.points.map(p => `<li class="flex items-center"><span class="mr-3 text-red-500 text-xl">❌</span>${p}</li>`).join('')}
            </ul>`;

        const navLinks = document.querySelectorAll('.step-nav');
        const contentPanels = document.querySelectorAll('.content-panel');

        function switchStep(step) {
            navLinks.forEach(link => {
                link.classList.toggle('active', link.dataset.step === step);
            });
            contentPanels.forEach(panel => {
                panel.classList.toggle('hidden', panel.id !== `step-${step}-content`);
            });
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                switchStep(e.currentTarget.dataset.step);
            });
        });

        switchStep('1');
    });
</script>

<footer class="bg-gray-800 text-white text-center p-4 mt-auto">
    <p>FikrLab 2025</p>
</footer>

</body>
</html>
