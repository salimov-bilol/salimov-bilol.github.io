<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Task 1: Structure Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Define the color palette and fonts */
        :root {
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-intro: #3b82f6; /* Blue */
            --color-overview: #8b5cf6; /* Violet */
            --color-detail1: #f97316; /* Orange */
            --color-detail2: #10b981; /* Emerald */
            --bg-light: #f8fafc; /* Slate 50 */
            --bg-dark: #1e293b; /* Slate 800 */
            --text-dark: #0f172a; /* Slate 900 */
            --text-light: #f1f5f9; /* Slate 100 */
            --text-muted: #64748b; /* Slate 500 */
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            font-weight: 700;
        }

        /* Styles for the navigation sidebar */
        .step-nav {
            transition: all 0.25s ease-in-out;
            border-left: 4px solid transparent;
        }

        .step-nav:hover {
            background-color: #334155; /* Slate 700 */
            transform: translateX(5px);
        }

        /* Active state styles for each step */
        .step-nav[data-step="1"].active {
            background-color: var(--color-intro);
            color: white;
            border-left-color: #dbeafe; /* Lighter blue */
        }
        .step-nav[data-step="2"].active {
            background-color: var(--color-overview);
            color: white;
            border-left-color: #ddd6fe; /* Lighter violet */
        }
        .step-nav[data-step="3"].active {
            background-color: var(--color-detail1);
            color: white;
            border-left-color: #fed7aa; /* Lighter orange */
        }
        .step-nav[data-step="4"].active {
            background-color: var(--color-detail2);
            color: white;
            border-left-color: #a7f3d0; /* Lighter emerald */
        }

        /* Animation for the content panels */
        .content-panel {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            will-change: opacity, transform;
        }

        .content-panel.hidden {
            opacity: 0;
            transform: translateY(15px);
            position: absolute;
            pointer-events: none;
            visibility: hidden;
        }
    </style>
</head>
<body class="antialiased">

<div class="flex flex-col md:flex-row min-h-screen bg-white">
    <!-- Left Navigation Panel -->
    <aside class="w-full md:w-1/3 lg:w-1/4 p-6 md:p-8 shadow-2xl" style="background-color: var(--bg-dark); color: var(--text-light);">
        <h1 class="text-3xl font-bold mb-2">Essay Flow</h1>
        <p class="mb-8" style="color: var(--text-muted);">Select a paragraph to build.</p>
        <nav id="steps-navigation" class="space-y-3">
            <!-- Navigation links will be populated by JS -->
        </nav>
    </aside>

    <!-- Right Content Panel -->
    <main class="w-full md:w-2/3 lg:w-3/4 p-6 sm:p-8 md:p-12 relative" style="background-color: var(--bg-light);">

        <!-- Content panels will be populated by JS -->
        <div id="content-panels-container"></div>

        <!-- Bottom Static Content: "Why it works" and "What to avoid" -->
        <div id="summary-section" class="mt-12 pt-8 border-t-2 border-slate-200">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div id="strategy-card"></div>
                <div id="avoid-card"></div>
            </div>
        </div>
    </main>
</div>

<!-- Data from original file -->
<script id="essay-data" type="application/json">
    {
        "intro": {
            "title": "Paragraph 1: Introduction",
            "subtitle": "The Opening Statement (1 Sentence)",
            "details": "This is a concise, paraphrased version of the question prompt. Its only job is to state what the graphic shows.",
            "goal": "To rephrase the question in your own words.",
            "actions": [
                "Use synonyms for keywords (e.g., 'shows' becomes 'illustrates').",
                "Change the word order and sentence structure."
            ],
            "example": {
                "prompt": "The chart below shows the changes in the amount of beef, lamb, chicken, and fish consumed in a particular European country between 1979 and 2004.",
                "band9": "The line graph illustrates how the consumption levels of four different types of meat and fish evolved in a specific European nation over a 25-year period starting in 1979."
            }
        },
        "overview": {
            "title": "Paragraph 2: Overview",
            "subtitle": "The 'Big Picture' Summary (2 Sentences)",
            "details": "This is the most critical paragraph for a high score. It provides a 'bird's-eye view' of the data's most important features without any specific numbers.",
            "goal": "To summarize the two or three most significant, overall trends visible in the graphic.",
            "actions": [
                "<strong>Sentence 1:</strong> Identify the first main feature (e.g., the most dramatic increase, the highest overall figure).",
                "<strong>Sentence 2:</strong> Identify the second main feature (e.g., the most significant decrease, a key intersection point)."
            ],
            "rule": "<strong>Crucial Rule:</strong> Do not include any specific data (numbers, percentages, years) in the overview. Keep it general."
        },
        "detail1": {
            "title": "Paragraph 3: Detail Paragraph 1",
            "subtitle": "First Set of Evidence",
            "details": "In this paragraph, you begin to support your overview by describing specific data points in a logically grouped way.",
            "goal": "To provide specific evidence for the first major trend you identified in the overview.",
            "actions": [
                "Group related information together (e.g., describe the categories that increased).",
                "Use specific numbers, percentages, and dates from the graphic to support your sentences.",
                "Make clear comparisons and contrasts between the data points you are describing."
            ]
        },
        "detail2": {
            "title": "Paragraph 4: Detail Paragraph 2",
            "subtitle": "Second Set of Evidence",
            "details": "This paragraph continues to provide specific, supporting data, focusing on the remaining information or the second key trend from your overview.",
            "goal": "To provide evidence for your second main point or cover the other key features of the graphic.",
            "actions": [
                "Group the remaining information logically (e.g., describe the categories that decreased).",
                "Continue to use exact figures from the graphic.",
                "Make further comparisons, highlighting how different categories relate to each other."
            ]
        },
        "strategy": {
            "title": "Why This Structure Works",
            "points": [
                "It fully answers the prompt.",
                "The logic is clear and easy to follow.",
                "It provides a framework to show vocabulary range.",
                "It allows for complex sentence structures."
            ]
        },
        "avoid": {
            "title": "What to Avoid",
            "points": [
                "Don't write conclusion! The overview is your summary.",
                "Never explain why trends happened. Just report the facts.",
                "Don't be a robot. Select only the most important data."
            ]
        }
    }
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const data = JSON.parse(document.getElementById('essay-data').textContent);
        const navContainer = document.getElementById('steps-navigation');
        const contentContainer = document.getElementById('content-panels-container');
        const strategyCard = document.getElementById('strategy-card');
        const avoidCard = document.getElementById('avoid-card');

        const steps = [
            { key: 'intro', color: 'var(--color-intro)', icon: '🎯' },
            { key: 'overview', color: 'var(--color-overview)', icon: '🎯' },
            { key: 'detail1', color: 'var(--color-detail1)', icon: '🎯' },
            { key: 'detail2', color: 'var(--color-detail2)', icon: '🎯' }
        ];

        // 1. Build Navigation and Content Panels
        steps.forEach((step, index) => {
            const stepKey = step.key;
            const stepData = data[stepKey];
            const stepNum = index + 1;

            // Create Nav Link
            const navLink = document.createElement('a');
            navLink.href = '#';
            navLink.className = 'step-nav block p-4 rounded-lg';
            navLink.style.backgroundColor = '#475569'; // Slate-600
            navLink.dataset.step = stepNum;
            navLink.innerHTML = `
                <h3 class="font-bold">${stepData.title}</h3>
                <p class="text-sm opacity-80">${stepData.subtitle}</p>
            `;
            navContainer.appendChild(navLink);

            // Create Content Panel
            const contentPanel = document.createElement('div');
            contentPanel.id = `step-${stepNum}-content`;
            contentPanel.className = 'content-panel hidden';

            let actionsHtml = stepData.actions.map(action => `<li>${action}</li>`).join('');
            let exampleHtml = '';
            if (stepData.example) {
                exampleHtml = `
                    <div class="mt-6 border-t pt-6">
                        <h4 class="text-xl font-bold mb-4">Example in Action:</h4>
                        <div class="bg-slate-100 p-4 rounded-md text-sm">
                            <p class="italic text-slate-500 mb-2"><strong>Original:</strong> "${stepData.example.prompt}"</p>
                            <p style="color: ${step.color};"><strong>Band 9 Version:</strong> "${stepData.example.band9}"</p>
                        </div>
                    </div>`;
            }
             let ruleHtml = '';
            if(stepData.rule) {
                ruleHtml = `
                <div class="mt-6 border-t pt-6">
                    <h4 class="text-xl font-bold text-red-600 mb-2">Crucial Rule</h4>
                    <p class="bg-red-100 text-red-700 p-4 rounded-md border-l-4 border-red-500">${stepData.rule}</p>
                </div>`
            }


            contentPanel.innerHTML = `
                <h2 class="text-3xl font-bold mb-4" style="color: ${step.color};">${stepData.title}: ${stepData.subtitle}</h2>
                <p class="text-lg text-slate-600 mb-6">${stepData.details}</p>
                <div class="bg-white p-6 rounded-lg shadow-md" style="border-left: 4px solid ${step.color};">
                    <h4 class="text-xl font-bold mb-4">Your Blueprint:</h4>
                    <ul class="space-y-4">
                        <li class="flex items-start">
                            <span class="text-2xl mr-4" style="color: ${step.color};">${step.icon}</span>
                            <div><strong class="text-slate-800">Goal:</strong> ${stepData.goal}</div>
                        </li>
                        <li class="flex items-start">
                            <span class="text-2xl mr-4" style="color: ${step.color};">✍️</span>
                            <div>
                                <strong class="text-slate-800">Action Checklist:</strong>
                                <ul class="list-disc list-inside mt-1 text-slate-600 space-y-1">
                                    ${actionsHtml}
                                </ul>
                            </div>
                        </li>
                    </ul>
                    ${exampleHtml}
                    ${ruleHtml}
                </div>
            `;
            contentContainer.appendChild(contentPanel);
        });

        // 2. Populate Summary Cards
        strategyCard.innerHTML = `
            <h3 class="text-2xl font-bold mb-4 text-green-600">Why This Structure Works</h3>
            <ul class="space-y-2 text-slate-600">
                ${data.strategy.points.map(p => `<li class="flex items-center"><span class="mr-3 text-green-500 text-xl">✔</span>${p}</li>`).join('')}
            </ul>`;

        avoidCard.innerHTML = `
            <h3 class="text-2xl font-bold mb-4 text-red-600">What to Avoid</h3>
            <ul class="space-y-2 text-slate-600">
                ${data.avoid.points.map(p => `<li class="flex items-center"><span class="mr-3 text-red-500 text-xl">❌</span>${p}</li>`).join('')}
            </ul>`;

        // 3. Add interactivity
        const navLinks = document.querySelectorAll('.step-nav');
        const contentPanels = document.querySelectorAll('.content-panel');

        function switchStep(step) {
            navLinks.forEach(link => {
                link.classList.toggle('active', link.dataset.step === step);
            });
            contentPanels.forEach(panel => {
                panel.classList.toggle('hidden', panel.id !== `step-${step}-content`);
            });
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                switchStep(e.currentTarget.dataset.step);
            });
        });

        // Initialize to show the first step
        switchStep('1');
    });
</script>
</body>
</html>
